name: Compilar APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK con licencias aceptadas;
      # AGP baja solo la plataforma 37 y las build-tools que falten.

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la llave del repo"
          else
            echo "::warning::Sin secret SIGNING_KEYSTORE_BASE64: se firma con una llave debug temporal y no se podrá actualizar encima de versiones anteriores"
          fi

      - name: Compilar debug y release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mantenimiento-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Al crear un release (o subir un tag v*), se le adjuntan los APKs y las notas
      - name: Publicar APKs en el release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mantenimiento-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mantenimiento-$TAG-debug.apk"
          NOTES=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --title "Mantenimiento $TAG" --notes-file "$NOTES"; fi
          else
            if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
            gh release create "$TAG" dist/*.apk --title "Mantenimiento $TAG" "${ARGS[@]}"
          fi
